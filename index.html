<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trabalhadores em Obra — Evolução</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#10243E;
    --navy-2:#16324F;
    --paper:#F5F2EA;
    --paper-2:#ECE7DA;
    --amber:#E8A33D;
    --amber-dk:#C97F1E;
    --steel:#5B6B7C;
    --rebar:#C1443A;
    --ink:#1B2733;
    --line:#D8D2C1;
    --grid-blue:rgba(255,255,255,0.07);
  }
  *{box-sizing:border-box;}
  html{overflow-x:hidden;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;overflow-x:hidden;max-width:100vw;}
  ::selection{background:var(--amber);color:var(--navy);}

  header{
    background:
      repeating-linear-gradient(0deg, var(--grid-blue) 0 1px, transparent 1px 28px),
      repeating-linear-gradient(90deg, var(--grid-blue) 0 1px, transparent 1px 28px),
      linear-gradient(160deg, var(--navy) 0%, var(--navy-2) 100%);
    color:var(--paper);
    padding:28px 5vw 20px;
    border-bottom:6px solid var(--amber);
  }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--amber);margin:0 0 6px;
  }
  h1{
    font-family:'Barlow Condensed',sans-serif;
    font-weight:700;
    font-size:clamp(28px,4vw,44px);
    line-height:.95;
    margin:0 0 4px;
    letter-spacing:.01em;
  }
  .updatedline{
    font-family:'IBM Plex Mono',monospace;font-size:12px;color:rgba(245,242,234,.6);
  }
  .updatedline b{color:var(--amber);font-weight:600;}

  nav.tabs{
    display:flex;gap:2px;margin-top:20px;
    border-top:1px solid rgba(245,242,234,.2);
  }
  nav.tabs button{
    font-family:'Barlow Condensed',sans-serif;
    font-size:19px;font-weight:600;letter-spacing:.03em;
    background:transparent;color:rgba(245,242,234,.55);
    border:none;padding:14px 22px 12px;cursor:pointer;
    border-bottom:3px solid transparent;
    transition:color .15s ease, border-color .15s ease;
  }
  nav.tabs button:hover{color:var(--paper);}
  nav.tabs button.active{color:var(--paper);border-bottom-color:var(--amber);}

  .filterbar{
    display:flex;flex-wrap:wrap;align-items:center;gap:10px;
    padding:14px 5vw;background:var(--paper-2);border-bottom:1px solid var(--line);
    row-gap:10px;
  }
  .frow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;width:100%;}
  .filterbar .flabel{
    font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--steel);margin-right:2px;min-width:64px;
  }
  .chip{
    font-family:'Inter',sans-serif;font-size:13px;font-weight:600;
    padding:6px 13px;border-radius:3px;border:1.5px solid var(--line);
    background:var(--paper);color:var(--steel);cursor:pointer;
    transition:all .12s ease;
  }
  .chip:hover{border-color:var(--amber-dk);}
  .chip.active{background:var(--navy);border-color:var(--navy);color:var(--paper);}

  main{padding:26px 5vw 50px;max-width:1150px;margin:0 auto;}

  .panel{background:#fff;border:1px solid var(--line);padding:22px 26px 18px;}
  .panel.chart-panel{background:#EEF0F1;}
  .panel h2{
    font-family:'Barlow Condensed',sans-serif;font-size:23px;font-weight:600;
    margin:0 0 2px;letter-spacing:.01em;
  }
  .panel .sub{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--steel);margin-bottom:8px;display:block;}

  .tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  table.datatable{border-collapse:collapse;font-family:'IBM Plex Mono',monospace;font-size:11.5px;white-space:nowrap;}
  table.datatable th, table.datatable td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:right;}
  table.datatable thead th{color:var(--steel);font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;border-bottom:1.5px solid var(--ink);}
  table.datatable thead tr.tgroup th{color:var(--amber-dk);text-align:center;border-bottom:1px solid var(--line);font-size:10px;}
  table.datatable th.tcat{text-align:left;font-weight:600;color:var(--ink);position:sticky;left:0;background:#fff;white-space:nowrap;}
  table.datatable .tdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;}
  table.datatable tbody tr:hover td{background:var(--paper-2);}
  @media (max-width:700px){
    table.datatable{font-size:10.5px;}
    table.datatable th, table.datatable td{padding:5px 7px;}
  }
  .chartwrap{position:relative;height:760px;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;}
  .chartinner{position:relative;height:100%;}
  canvas{max-width:100%;}

  footer{
    padding:16px 5vw 30px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--steel);
    display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;
  }

  @media (max-width:700px){
    .chartwrap{height:600px;}
    .filterbar .flabel{min-width:auto;width:100%;margin-bottom:-4px;}
  }
  .loading, .errbox{padding:40px 0;font-family:'IBM Plex Mono',monospace;color:var(--steel);text-align:center;}
  .errbox{color:var(--rebar);}
</style>
</head>
<body>

<header>
  <p class="eyebrow">Controlo Geral de Trabalhadores — Obra</p>
  <h1>Evolução de Trabalhadores em Obra</h1>
  <p class="updatedline">Última leitura: <b id="stampData">—</b> · atualização automática diária às <b>11:30</b></p>
  <nav class="tabs">
    <button data-tab="diaria" class="active">DIÁRIA</button>
    <button data-tab="semanal">SEMANAL</button>
    <button data-tab="mensal">MENSAL</button>
  </nav>
</header>

<div class="filterbar">
  <div class="frow">
    <span class="flabel">Categoria</span>
    <div id="chipRowCat"></div>
  </div>
  <div class="frow">
    <span class="flabel">Mês</span>
    <div id="chipRowMes"></div>
  </div>
</div>

<main id="main">
  <div class="loading">A carregar dados.json…</div>
</main>

<footer>
  <span>Fonte: Controlo_Geral_Trab_.xlsx (folha "Evolução")</span>
</footer>

<script>
  // Carrega o Chart.js tentando várias fontes (algumas redes/navegadores bloqueiam CDNs específicos).
  (function(){
    var sources = [
      'https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js',
      'https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js',
      'https://unpkg.com/chart.js@4.4.4/dist/chart.umd.min.js'
    ];
    window.__chartReady = false;
    window.__chartFailed = false;
    function tryNext(i){
      if(i >= sources.length){ window.__chartFailed = true; document.dispatchEvent(new Event('chartlibdone')); return; }
      var s = document.createElement('script');
      s.src = sources[i];
      s.onload = function(){
        if (typeof Chart !== 'undefined') {
          window.__chartReady = true;
          document.dispatchEvent(new Event('chartlibdone'));
        } else {
          tryNext(i+1);
        }
      };
      s.onerror = function(){ tryNext(i+1); };
      document.head.appendChild(s);
    }
    tryNext(0);
  })();
</script>
<script>
const COLORS = {
  'Carpinteiros':'#2F8FE0',
  'Ferrageiros':'#E8748A',
  'Especialidades':'#D4A017',
  'Gesso Cartonado':'#E08A3C',
  'Total Em Obra':'#D954A6'
};
const CAT_ORDER = ['Carpinteiros','Ferrageiros','Especialidades','Gesso Cartonado','Total Em Obra'];
const MESES_ABREV = {'Janeiro':'jan','Fevereiro':'fev','Março':'mar','Abril':'abr','Maio':'mai','Junho':'jun','Julho':'jul','Agosto':'ago','Setembro':'set','Outubro':'out','Novembro':'nov','Dezembro':'dez'};
const MESES_ARR = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const MESES_ABREV_KEYS = MESES_ARR;

let RAW = null;
let activeTab = 'diaria';
let activeCats = new Set(CAT_ORDER);
let activeMonths = new Set();
let monthOrder = [];
let monthsCustomized = false;
let mainChart = null;
let pluginsRegistered = false;
const DIARIA_TARGET_DIAS = 22;
const MOBILE_DIARIA_DIAS = 10;
const MOBILE_SEMANAL_SEMANAS = 4;
function isMobile(){ return window.matchMedia('(max-width:700px)').matches; }

function fmtDateShort(iso){
  const d = new Date(iso+'T00:00:00');
  return d.getDate() + ' ' + MESES_ARR[d.getMonth()];
}

async function boot(){
  try{
    const res = await fetch('dados.json?_=' + Date.now());
    if(!res.ok) throw new Error('HTTP '+res.status);
    RAW = await res.json();
  }catch(e){
    document.getElementById('main').innerHTML =
      '<div class="errbox">Não foi possível carregar dados.json. Confirma que o ficheiro está na mesma pasta que este index.html.<br>Detalhe: '+e.message+'</div>';
    return;
  }

  const order=[]; const seen=new Set();
  RAW.registos.forEach(r=>{ if(!seen.has(r.mes)){seen.add(r.mes); order.push(r.mes);} });
  monthOrder = order;
  applyDefaultMonthsForTab();
  populateCatChips();
  updateStamp();

  if(window.__chartReady){ render(); }
  else if(window.__chartFailed){ render(); }
  else{ document.addEventListener('chartlibdone', ()=>render(), {once:true}); }
}

function applyDefaultMonthsForTab(){
  monthsCustomized = false;
  if(activeTab==='mensal'){ activeMonths = new Set(monthOrder); }
  else if(activeTab==='semanal'){ activeMonths = new Set(monthOrder.slice(-4)); }
  else{ activeMonths = new Set([monthOrder[monthOrder.length-1]]); }
  renderMesChips();
}

function renderMesChips(){
  const row = document.getElementById('chipRowMes');
  row.innerHTML = monthOrder.map(m=>`<button class="chip ${activeMonths.has(m)?'active':''}" data-mes="${m}">${m}</button>`).join('');
  row.querySelectorAll('.chip').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const m = btn.dataset.mes;
      monthsCustomized = true;
      if(activeMonths.has(m)){ if(activeMonths.size>1){ activeMonths.delete(m); btn.classList.remove('active'); } }
      else{ activeMonths.add(m); btn.classList.add('active'); }
      render();
    });
  });
}

function populateCatChips(){
  const row = document.getElementById('chipRowCat');
  row.innerHTML = CAT_ORDER.map(c=>`<button class="chip active" data-cat="${c}">${c}</button>`).join('');
  row.querySelectorAll('.chip').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const cat = btn.dataset.cat;
      if(activeCats.has(cat)){ if(activeCats.size>1){ activeCats.delete(cat); btn.classList.remove('active'); } }
      else{ activeCats.add(cat); btn.classList.add('active'); }
      render();
    });
  });
}

function updateStamp(){
  const totals = RAW.registos.filter(r=>r.categoria==='Total Em Obra').sort((a,b)=>a.data.localeCompare(b.data));
  if(totals.length){
    document.getElementById('stampData').textContent = fmtDateShort(totals[totals.length-1].data);
  } else if(RAW.atualizadoEm){
    document.getElementById('stampData').textContent = RAW.atualizadoEm;
  }
}

document.querySelectorAll('nav.tabs button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    activeTab = btn.dataset.tab;
    applyDefaultMonthsForTab();
    render();
  });
});

function filteredByMonth(){
  return RAW.registos.filter(r=>activeMonths.has(r.mes));
}

function registerPluginsOnce(){
  if(pluginsRegistered || typeof Chart === 'undefined') return;
  Chart.register({
    id: 'endLabels',
    afterDatasetsDraw(chart){
      const {ctx} = chart;
      const items = [];
      chart.data.datasets.forEach((ds,i)=>{
        const meta = chart.getDatasetMeta(i);
        if(!meta || meta.hidden) return;
        let lastIdx = -1;
        for(let j=ds.data.length-1;j>=0;j--){ if(ds.data[j]!==null && ds.data[j]!==undefined){ lastIdx=j; break; } }
        if(lastIdx===-1) return;
        const point = meta.data[lastIdx];
        if(!point) return;
        items.push({ y: point.y, origY: point.y, x: point.x, text: ds.label, color: ds.borderColor });
      });
      // anti-colisão: ordena por posição vertical e impõe espaçamento mínimo entre etiquetas
      items.sort((a,b)=>a.y-b.y);
      const MIN_GAP = 15;
      for(let k=1;k<items.length;k++){
        if(items[k].y - items[k-1].y < MIN_GAP){
          items[k].y = items[k-1].y + MIN_GAP;
        }
      }
      ctx.save();
      ctx.font = "700 8.5px 'Inter', sans-serif";
      ctx.textBaseline = 'middle';
      ctx.textAlign = 'left';
      items.forEach(it=>{
        ctx.fillStyle = it.color;
        // se a etiqueta foi empurrada para longe do ponto real, desenha uma pequena seta a apontar para ele
        if(Math.abs(it.y - it.origY) > 3){
          ctx.save();
          ctx.strokeStyle = it.color;
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.moveTo(it.x + 3, it.origY);
          ctx.lineTo(it.x + 6, it.y);
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(it.x + 3, it.origY, 1.6, 0, Math.PI*2);
          ctx.fillStyle = it.color;
          ctx.fill();
          ctx.restore();
        }
        ctx.fillText(it.text, it.x + 8, it.y);
      });
      ctx.restore();
    }
  });
  Chart.register({
    id: 'valueLabels',
    afterDatasetsDraw(chart){
      const visibleDatasets = chart.data.datasets
        .map((ds,i)=>({ds,i}))
        .filter(({i})=>{ const m=chart.getDatasetMeta(i); return m && !m.hidden; });
      const nPoints = chart.data.labels.length;
      if(visibleDatasets.length===0 || nPoints===0) return;
      const {ctx} = chart;
      const showIdx = new Set();
      for(let idx=0; idx<nPoints; idx++) showIdx.add(idx);

      ctx.save();
      ctx.font = "700 8px 'IBM Plex Mono', monospace";
      ctx.textAlign = 'center';
      // para cada ponto visível no eixo X, resolve colisões entre as etiquetas das várias séries nesse ponto
      showIdx.forEach(idx=>{
        const col = [];
        visibleDatasets.forEach(({ds,i})=>{
          const v = ds.data[idx];
          if(v===null || v===undefined) return;
          const meta = chart.getDatasetMeta(i);
          const point = meta.data[idx];
          if(!point) return;
          col.push({ y: point.y - 7, origY: point.y - 7, x: point.x, text: String(Math.round(v)), color: ds.borderColor });
        });
        col.sort((a,b)=>a.y-b.y);
        const MIN_GAP = 10;
        for(let k=col.length-2;k>=0;k--){
          if(col[k+1].y - col[k].y < MIN_GAP){
            col[k].y = col[k+1].y - MIN_GAP;
          }
        }
        col.forEach(it=>{
          ctx.fillStyle = it.color;
          ctx.textBaseline = 'bottom';
          // se a etiqueta foi empurrada, desenha uma pequena seta a ligar de volta ao ponto real
          if(Math.abs(it.y - it.origY) > 3){
            ctx.save();
            ctx.strokeStyle = it.color;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(it.x, it.origY + 6);
            ctx.lineTo(it.x, it.y + 2);
            ctx.stroke();
            ctx.restore();
          }
          ctx.fillText(it.text, it.x, it.y);
        });
      });
      ctx.restore();
    }
  });
  Chart.register({
    id: 'groupAxis',
    afterDraw(chart){
      const groups = chart.data.groups;
      const {ctx, chartArea, scales} = chart;
      const xScale = scales.x;
      if(groups && groups.length){
        const yLine = chartArea.bottom + 18;
        const yText = chartArea.bottom + 30;
        ctx.save();
        ctx.strokeStyle = 'rgba(0,0,0,0.4)';
        ctx.lineWidth = 1;
        ctx.font = "600 10px 'IBM Plex Mono', monospace";
        ctx.fillStyle = '#000000';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        let i = 0;
        while(i < groups.length){
          let j = i;
          while(j+1 < groups.length && groups[j+1] === groups[i]) j++;
          const xStart = xScale.getPixelForValue(i);
          const xEnd = xScale.getPixelForValue(j);
          ctx.setLineDash([2,3]);
          ctx.beginPath();
          ctx.moveTo(Math.max(xStart, chartArea.left), yLine);
          ctx.lineTo(Math.min(xEnd, chartArea.right), yLine);
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.fillText(groups[i], (xStart+xEnd)/2, yText);
          i = j+1;
        }
        ctx.restore();
      }
      if(chart.data.axisTitle){
        ctx.save();
        ctx.font = "600 11px 'Barlow Condensed', sans-serif";
        ctx.fillStyle = '#000000';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const yTitle = groups && groups.length ? chartArea.bottom + 46 : chartArea.bottom + 24;
        ctx.fillText(chart.data.axisTitle, (chartArea.left+chartArea.right)/2, yTitle);
        ctx.restore();
      }
    }
  });
  pluginsRegistered = true;
}

function groupSum(rows, keyFn){
  const m = new Map();
  rows.forEach(r=>{
    const k = keyFn(r);
    if(!m.has(k)) m.set(k, {});
    const o = m.get(k);
    o[r.categoria] = (o[r.categoria]||0) + r.nTotal;
  });
  return m;
}

function buildDatasets(map, keys){
  return CAT_ORDER.filter(c=>activeCats.has(c)).map(cat=>({
    label:cat, data:keys.map(k=> (map.get(k)||{})[cat] ?? null),
    borderColor:COLORS[cat], backgroundColor:COLORS[cat],
    tension:.25, pointRadius:0, pointHoverRadius:4, pointHitRadius:10, borderWidth: cat==='Total Em Obra'?3.25:2.5,
    spanGaps:true, yAxisID: cat==='Total Em Obra' ? 'y1' : 'y'
  }));
}

function computeAxisRanges(datasets){
  const catVals = [], totVals = [];
  datasets.forEach(ds=>{
    (ds.data||[]).forEach(v=>{
      if(v===null || v===undefined) return;
      (ds.yAxisID==='y1' ? totVals : catVals).push(v);
    });
  });
  const hasCats = catVals.length>0, hasTotal = totVals.length>0;
  if(!hasCats || !hasTotal) return { split:false };

  const catMax = Math.max(...catVals);
  const yMax = catMax / 0.42; // categorias ficam confinadas ao ~42% inferior do gráfico

  const totalMin = Math.min(...totVals), totalMax = Math.max(...totVals);
  const DMIN=0.56, DMAX=0.94; // Total Em Obra ocupa a faixa 56%-94% do gráfico (sempre acima das categorias)
  const totalRange = (totalMax - totalMin) || Math.max(totalMax*0.05, 1);
  const axisRange = totalRange / (DMAX - DMIN);
  const y1Min = totalMin - DMIN*axisRange;
  const y1Max = y1Min + axisRange;

  return { split:true, yMax, y1Min, y1Max };
}

function renderTable(labels, datasets, groups, titulo){
  document.getElementById('tableTitle').textContent = titulo;
  const wrap = document.getElementById('tableWrap');
  if(!datasets.length || !labels.length){ wrap.innerHTML = '<p class="sub">Sem dados para mostrar.</p>'; return; }

  let groupRow = '';
  if(groups && groups.length===labels.length){
    let cells = '';
    let i=0;
    while(i<groups.length){
      let j=i;
      while(j+1<groups.length && groups[j+1]===groups[i]) j++;
      cells += `<th colspan="${j-i+1}">${groups[i]}</th>`;
      i = j+1;
    }
    groupRow = `<tr class="tgroup"><th></th>${cells}</tr>`;
  }

  const headerCells = labels.map(l=>`<th>${l}</th>`).join('');
  const bodyRows = datasets.map(ds=>{
    const cells = ds.data.map(v=> `<td>${(v===null||v===undefined) ? '—' : Math.round(v)}</td>`).join('');
    return `<tr><th class="tcat"><span class="tdot" style="background:${ds.borderColor};"></span>${ds.label}</th>${cells}</tr>`;
  }).join('');

  wrap.innerHTML = `<table class="datatable">
    <thead>${groupRow}<tr><th></th>${headerCells}</tr></thead>
    <tbody>${bodyRows}</tbody>
  </table>`;
}

function drawChart(labels, datasets, groups, axisTitle){
  registerPluginsOnce();
  const wrap = document.getElementById('chartwrap');
  const mobile = isMobile();
  const minWidth = mobile ? Math.max(wrap.clientWidth, labels.length * 30) : wrap.clientWidth;
  wrap.innerHTML = `<div class="chartinner" style="min-width:${minWidth}px;"><canvas id="lineChart"></canvas></div>`;
  if(typeof Chart === 'undefined'){
    wrap.innerHTML = '<div class="errbox">Não foi possível carregar a biblioteca de gráficos (rede bloqueou todas as fontes tentadas). Fala com o teu departamento de TI, ou abre o site noutra rede/navegador.</div>';
    return;
  }
  const ctx = document.getElementById('lineChart');
  if(mainChart) mainChart.destroy();
  const ranges = computeAxisRanges(datasets);
  const bottomPad = groups ? 56 : 34;
  mainChart = new Chart(ctx, {
    type:'line',
    data:{ labels, datasets, groups, axisTitle },
    options:{
      responsive:true, maintainAspectRatio:false,
      layout:{ padding:{ right:82, top:26, bottom:bottomPad } },
      interaction:{ mode:'nearest', intersect:false },
      plugins:{ legend:{ display:false }, tooltip:{ enabled:false } },
      scales:{
        x:{ grid:{display:false}, ticks:{font:{family:"'IBM Plex Mono'",size:9}, color:'#000000'} },
        y:{ position:'left', min:0, max: ranges.split ? ranges.yMax : undefined, beginAtZero:true,
            grid:{color:'rgba(0,0,0,0.09)'}, ticks:{font:{family:"'IBM Plex Mono'",size:9}, color:'#000000'} },
        y1:{ position:'right', min: ranges.split ? ranges.y1Min : undefined, max: ranges.split ? ranges.y1Max : undefined,
            grid:{display:false}, ticks:{display:false} } // sem números à direita — evita sobrepor as etiquetas de categoria
      }
    }
  });
  // ao abrir, mostra sempre o fim (dados mais recentes) — quem quiser vê o resto fazendo scroll para trás
  wrap.scrollLeft = wrap.scrollWidth;
}

function render(){
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="panel chart-panel">
      <h2 id="chartTitle"></h2>
      <span class="sub" id="chartSub"></span>
      <div class="chartwrap" id="chartwrap"></div>
    </div>
    <div class="panel" style="margin-top:16px;">
      <h2 id="tableTitle"></h2>
      <span class="sub" id="tableSub">Mesmos dados do gráfico, em formato tabela</span>
      <div id="tableWrap" class="tablewrap"></div>
    </div>`;

  const rows = filteredByMonth();

  if(activeTab==='diaria') renderDiaria(rows);
  if(activeTab==='semanal') renderSemanal(rows);
  if(activeTab==='mensal') renderMensal();
}

function getDiariaDates(rows){
  let dates = [...new Set(rows.map(r=>r.data))].sort();
  if(!monthsCustomized && dates.length < DIARIA_TARGET_DIAS){
    const allDates = [...new Set(RAW.registos.map(r=>r.data))].sort();
    const endDate = dates.length ? dates[dates.length-1] : allDates[allDates.length-1];
    const endIdx = allDates.indexOf(endDate);
    const startIdx = Math.max(0, endIdx - DIARIA_TARGET_DIAS + 1);
    dates = allDates.slice(startIdx, endIdx+1);
  }
  return dates;
}

function renderDiaria(rows){
  document.getElementById('chartTitle').textContent = 'Evolução diária por categoria';
  document.getElementById('chartSub').textContent = 'Nº de trabalhadores por dia';
  const dates = getDiariaDates(rows);
  const dateSet = new Set(dates);
  const rowsForChart = RAW.registos.filter(r=>dateSet.has(r.data));
  const map = groupSum(rowsForChart, r=>r.data);
  const labels = dates.map(d=> new Date(d+'T00:00:00').getDate());
  const groups = dates.map(d=>{
    const dt = new Date(d+'T00:00:00');
    return MESES_ABREV_KEYS[dt.getMonth()];
  });
  drawChart(labels, buildDatasets(map, dates), groups, 'Dia');
  renderTable(labels, buildDatasets(map, dates), groups, 'Evolução diária');
}

function renderSemanal(rows){
  document.getElementById('chartTitle').textContent = 'Evolução semanal por categoria';
  document.getElementById('chartSub').textContent = 'Média de trabalhadores por semana — meses selecionados';
  let weeks = [...new Set(rows.map(r=>r.mes+'|'+r.semana))];
  weeks.sort((a,b)=>{
    const ra = rows.find(r=>(r.mes+'|'+r.semana)===a);
    const rb = rows.find(r=>(r.mes+'|'+r.semana)===b);
    return ra.data.localeCompare(rb.data);
  });
  const avgMap = new Map();
  const groups = [];
  const labels = weeks.map(w=>{
    const [mes,sem] = w.split('|');
    const rr = rows.filter(r=>r.mes===mes && r.semana===sem);
    const o = {};
    CAT_ORDER.forEach(c=>{
      const cr = rr.filter(r=>r.categoria===c);
      const dias = [...new Set(cr.map(r=>r.data))];
      o[c] = dias.length? Math.round(dias.reduce((s,d)=>s+cr.filter(r=>r.data===d).reduce((s2,r)=>s2+r.nTotal,0),0)/dias.length) : null;
    });
    avgMap.set(w,o);
    groups.push(mes.toLowerCase());
    return sem;
  });
  drawChart(labels, buildDatasets(avgMap, weeks), groups, 'Semana');
  renderTable(labels, buildDatasets(avgMap, weeks), groups, 'Evolução semanal (médias)');
}

function renderMensal(){
  document.getElementById('chartTitle').textContent = 'Evolução mensal por categoria';
  document.getElementById('chartSub').textContent = 'Média de trabalhadores por mês — meses selecionados';
  const rows = filteredByMonth();
  const months=[]; const seen=new Set();
  rows.forEach(r=>{ if(!seen.has(r.mes)){seen.add(r.mes); months.push(r.mes);} });
  const avgMap = new Map();
  months.forEach(mes=>{
    const rr = rows.filter(r=>r.mes===mes);
    const o = {};
    CAT_ORDER.forEach(c=>{
      const cr = rr.filter(r=>r.categoria===c);
      const dias = [...new Set(cr.map(r=>r.data))];
      o[c] = dias.length? Math.round(dias.reduce((s,d)=>s+cr.filter(r=>r.data===d).reduce((s2,r)=>s2+r.nTotal,0),0)/dias.length) : null;
    });
    avgMap.set(mes,o);
  });
  drawChart(months.map(m=>MESES_ABREV[m]), buildDatasets(avgMap, months), null, 'Mês');
  renderTable(months.map(m=>MESES_ABREV[m]), buildDatasets(avgMap, months), null, 'Evolução mensal (médias)');
}

boot();
</script>
